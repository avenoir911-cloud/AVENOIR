<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AVENOIR · الطلب</title>
<link rel="icon" href="%%A%%favicon.svg" type="image/svg+xml">
<style>
/* Shown when the checkout server cannot take an order (for example a checkout link opened directly, without the
   delivery form). Supabase serves function responses as text/plain, so the server redirects here instead of
   printing a page itself. Nothing is created before this page is shown. */
:root{color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F1EA;color:#111;font:16px/1.7 "Noto Naskh Arabic",Tahoma,system-ui,sans-serif;padding:24px}
.card{max-width:460px;width:100%;text-align:center;display:grid;gap:14px}
.logo{letter-spacing:.32em;font:400 13px/1 Arial,sans-serif;direction:ltr}
p{margin:0}.en{direction:ltr;color:#5f5850;font-family:Arial,sans-serif;font-size:15px}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:50px;padding:0 22px;background:#111;color:#F4F1EA;text-decoration:none;font-weight:600}
.ig{color:#111;font-size:14.5px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">AVENOIR</div>
  <p id="ar" style="font-size:18px">اطلب من صفحة الساعة حتى نأخذ بيانات التوصيل.</p>
  <p class="en" id="en">Please order from the watch page so we can take your delivery details.</p>
  <a class="btn" id="back" href="%%H%%">العودة إلى الساعة · Back to the watch</a>
  <a class="ig" href="https://www.instagram.com/avenoir.watches/" rel="noopener" target="_blank">راسلنا على إنستغرام · Message us on Instagram</a>
</div>
<script>
(() => {
  const M = { direct: ['اطلب من صفحة الساعة حتى نأخذ بيانات التوصيل.', 'Please order from the watch page so we can take your delivery details.'],
    model: ['هذه الساعة غير متوفرة للطلب أونلاين.', 'This watch can’t be ordered online.'],
    option: ['أحد الخيارات غير متوفر. اختر مرة أخرى من صفحة الساعة.', 'One of the options is not available. Please choose again on the watch page.'],
    details: ['بعض بيانات التوصيل ناقصة أو غير صحيحة. لم يُنشأ أي طلب ولم يُخصم أي مبلغ.', 'Some delivery details were missing or not valid. No order was created and you were not charged.'],
    server: ['تعذّر فتح صفحة الدفع الآن. لم يُخصم أي مبلغ. حاول مرة أخرى بعد قليل.', 'We could not open the payment page just now. You were not charged. Please try again in a moment.'] };
  const q = new URLSearchParams(location.search), e = M[q.get('e')] ? q.get('e') : 'direct', m = q.get('m');
  document.getElementById('ar').textContent = M[e][0]; document.getElementById('en').textContent = M[e][1];
  // back to the same watch with the same choices (only known option names are copied)
  if (/^(monti|lumi|rayo|bloom)$/.test(m || '')) {
    const keep = new URLSearchParams(); for (const k of ['tier', 'strap', 'hands', 'colour', 'dial', 'x']) { const v = q.get(k); if (v && /^[a-z,-]{1,60}$/.test(v)) keep.set(k, v); }
    document.getElementById('back').href = `%%H%%watch/${m}/` + (keep.toString() ? '?' + keep : '');
  }
})();
</script>
</body>
</html>
